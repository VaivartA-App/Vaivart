name: vaivart
description: Vaivart — A free, offline, open-source file converter. No ads, no watermarks, no sign-in.
publish_to: 'none'
version: 1.1.0+11

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  path: ^1.9.0
  path_provider: ^2.1.5
  archive: ^3.6.1
  image: ^4.3.0
  pdf: ^3.12.0
  printing: ^5.14.3
  excel: ^4.0.2
  syncfusion_flutter_pdf: ^33.2.13
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
